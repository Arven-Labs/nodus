name: CI

# Baseado em padrao/workflows/ci-rust.yml do workspace (ADR 0009: build, clippy e testes rodam só no CI).
# Sem filtro de caminho, de propósito: o check `Rust (clippy and tests)` pode ser obrigatório na main,
# e um check que nem dispara (PR só de docs) ficaria pendente para sempre e travaria o merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo na mesma ref cancela a rodada que ainda está em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental só ajuda quem recompila a mesma árvore; no CI só engorda o cache.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    # O nome é o contexto do check no ruleset da main: não renomear sem atualizar o ruleset.
    name: Rust (clippy and tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # `-D warnings` reprova o PR por warning; um clippy novo no `@stable` pode criar warnings sem
      # o código mudar (para fixar a versão, use um `rust-toolchain.toml`).
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        # Sem parar no primeiro crate que falha, para a rodada mostrar todas as falhas de uma vez.
        # A saída também vai para um arquivo, para o passo seguinte listar o que falhou no resumo;
        # `pipefail` (do `shell: bash`) mantém o status do `cargo test`.
        shell: bash
        run: cargo test --locked --workspace --no-fail-fast 2>&1 | tee cargo-test.log

      # Só LISTA o nome de cada teste que falhou e a linha do panic. Nada é escondido: o job continua vermelho.
      - name: Failed tests
        if: failure()
        shell: bash
        run: |
          {
            echo "## Failed tests"
            echo
            echo '```'
            grep -E '^test .* FAILED$|panicked at ' cargo-test.log | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
