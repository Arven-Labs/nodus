# cargo-deny (P-11, ADR 0007): licenças, avisos do RustSec, bans e fontes. Roda no job `cargo-deny` do CI.
# O que não está aqui usa o default do cargo-deny 0.20 (advisories: unmaintained = "all", yanked = "warn";
# bans: multiple-versions = "warn"; sources: só crates.io).

[licenses]
# Mínimo que cobre o Cargo.lock: o `unicode-ident` exige Unicode-3.0 (com AND); Zlib e Unlicense
# só aparecem em OR com MIT, então não precisam entrar.
allow = ["MIT", "Apache-2.0"]
