[package]
name = "nodus-desktop"
version = "0.1.0"
description = "nodus desktop (Tauri): interface de leitura sobre o nodusctl (ADR 0026)"
edition = "2024"
license = "MIT"
publish = false

# Workspace PRÓPRIO, fora do workspace do `nodusctl` (raiz do repositório): `cargo install --locked ... nodus-cli`
# e o `cargo-deny` da CLI não podem passar a puxar as centenas de crates do Tauri (ADR 0026, P-12).
[workspace]

[lib]
name = "nodus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
